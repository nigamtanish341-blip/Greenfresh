
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greenfresh</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: Arial, sans-serif;
  background: #f4fff4;
  color: #183b20;
}
header {
  background: #159447;
  color: white;
  padding: 22px;
  text-align: center;
}
header h1 {
  font-size: 30px;
}
.search {
  padding: 15px;
}
.search input {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #ddd;
}
h2 {
  padding: 15px;
}
.products {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  padding: 15px;
}
.card {
  background: white;
  padding: 15px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 2px 8px #ddd;
}
.card .emoji {
  font-size: 55px;
}
.card button {
  background: #159447;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
}
</style>
</head>
<body>

<header>
<h1>🥬 Greenfresh</h1>
<p>Fresh Vegetables at Your Doorstep</p>
</header>

<div class="search">
<input type="text" placeholder="Search vegetables...">
</div>

<h2>Fresh Vegetables</h2>

<div class="products">
<div class="card">
<div class="emoji">🥔</div>
<h3>Potato</h3>
<p>₹30 / kg</p>
<button onclick="addCart('Potato')">Add to Cart</button>
</div>

<div class="card">
<div class="emoji">🍅</div>
<h3>Tomato</h3>
<p>₹40 / kg</p>
<button onclick="addCart('Tomato')">Add to Cart</button>
</div>

<div class="card">
<div class="emoji">🧅</div>
<h3>Onion</h3>
<p>₹35 / kg</p>
<button onclick="addCart('Onion')">Add to Cart</button>
</div>

<div class="card">
<div class="emoji">🥦</div>
<h3>Broccoli</h3>
<p>₹60 / kg</p>
<button onclick="addCart('Broccoli')">Add to Cart</button>
</div>
</div>

<script>
function addCart(name) {
  alert(name + " added to cart!");
}
</script>

</body>
</html>
